[project]
name = "ha-google-tv-media-aggregator"
version = "0.1.0"
description = "Home Assistant custom integration that adds artwork to Google TV Streamer media players."
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "D"]
ignore = [
  "D203",
  "D213",
  "E501",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR2004",
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR0915", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
