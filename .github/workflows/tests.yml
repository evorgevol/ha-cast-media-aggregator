name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  pytest:
    name: Pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest Home Assistant
            python: "3.14"
            phcc: pytest-homeassistant-custom-component
          # Minimum supported version declared in hacs.json (HA 2025.4.1).
          - name: Home Assistant 2025.4
            python: "3.13"
            phcc: pytest-homeassistant-custom-component==0.13.233
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "${{ matrix.phcc }}"
      - run: pytest tests -q
